name: Test
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.platform }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel: ['8.5.0', '9.3.1']
        platform: [linux-amd64, linux-arm64, macos-arm64, windows-amd64, windows-arm64]
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-amd64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.30.0'
      - name: Execute default runtimes through the public APIs
        working-directory: e2e/smoke
        run: bazel test //... --lockfile_mode=off --test_env=RULES_WINE_EXPECTED_CPU=${{ contains(matrix.platform, 'arm64') && 'aarch64' || 'x86_64' }}
      - name: Execute native developer tools without a consumer compiler
        working-directory: e2e/tools
        run: bazel test //... --lockfile_mode=off
      - name: Runtime contracts, custom runfiles and generated RPC compilation
        if: matrix.platform == 'linux-amd64'
        run: bazel test //... --lockfile_mode=off
      - name: Optional path mapping
        if: matrix.platform == 'linux-amd64'
        run: |
          bazel test //tests:argv_test //tests:mapping_test --config=mapped --lockfile_mode=off
          (cd e2e/smoke && bazel test //... --config=mapped --lockfile_mode=off)
          (cd e2e/tools && bazel test //... --config=mapped --lockfile_mode=off)
      - name: Starlark and execution-platform contracts
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/starlark
        run: bazel test //... --lockfile_mode=off
      - name: External module generation and compiler-free dependency graph
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/tools_caller
        run: |
          bazel test //... --lockfile_mode=off
          bazel test //... --config=mapped --lockfile_mode=off
          bazel mod graph --lockfile_mode=off --output=json > modules.json
          jq -e 'all(.. | objects; .name != "llvm")' modules.json
      - name: Caller-supplied archive through public toolchains
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/custom_runtime
        run: bazel test //... --lockfile_mode=off
      - name: Undeclared assets and imports stay outside the sandbox
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/tools
        run: |
          if bazel build //:missing_asset --lockfile_mode=off > "$RUNNER_TEMP/missing-asset.log" 2>&1; then
            echo 'Undeclared asset unexpectedly available'; exit 1
          fi
          grep -q 'payload.txt' "$RUNNER_TEMP/missing-asset.log"
          if bazel build //:missing_import --lockfile_mode=off > "$RUNNER_TEMP/missing-import.log" 2>&1; then
            echo 'Undeclared import unexpectedly available'; exit 1
          fi
          grep -q 'example.idl' "$RUNNER_TEMP/missing-import.log"
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.bazel }}
          path: |
            bazel-testlogs/**/test.log
            e2e/*/bazel-testlogs/**/test.log
            ${{ runner.temp }}/missing-*.log
