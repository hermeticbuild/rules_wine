name: Test
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.platform }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel: ['8.5.0', '9.3.1']
        platform: [linux-amd64, linux-arm64, macos-arm64, windows-amd64, windows-arm64, regressions]
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-amd64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: regressions
            runner: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.30.0'
      - name: Execute default runtimes through the public APIs
        if: matrix.platform != 'regressions'
        run: bash e2e/test_runtime.sh
      - name: Execute native developer tools without a consumer compiler
        if: matrix.platform != 'regressions'
        run: bash e2e/test_tools.sh
      - name: Lifecycle, runfiles and argument regressions
        if: matrix.platform == 'regressions'
        run: |
          bazel test //tests:integration --lockfile_mode=off
          bazel test //tests:tool_binary_runfiles_test --extra_toolchains=//tests:native_executable_runfiles_registration --lockfile_mode=off
      - name: Path mapping regressions
        if: matrix.platform == 'regressions'
        run: bash e2e/test_path_mapping.sh
      - name: Compile generated RPC source with a consumer-owned Windows SDK
        if: matrix.platform == 'regressions'
        run: |
          bazel build //tests:generated_rpc --lockfile_mode=off --platforms=@llvm//platforms:windows_x86_64
          bazel build //tests:generated_rpc --lockfile_mode=off --platforms=@llvm//platforms:windows_aarch64
      - name: Starlark and module extension contracts
        if: matrix.platform == 'regressions'
        run: |
          bash e2e/test_starlark.sh
          bash e2e/test_extension.sh
          bash e2e/test_tools_external.sh
          bash e2e/test_tools_selection.sh
      - name: Caller-supplied archive through public toolchains
        if: matrix.platform == 'regressions'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/hermeticbuild/wine-prebuilt/releases/download/11.20.2/wine-linux-amd64-11.20.2.tar.zst \
            -o "$RUNNER_TEMP/custom-wine.tar.zst"
          bash e2e/test_custom_archive.sh "$RUNNER_TEMP/custom-wine.tar.zst" \
            5fb0f5f32a305873337e0202638acc64f59690c7a0184a6ea6a0164a79e31dc7
      - name: Preserve runtime failure logs
        if: failure() && matrix.platform != 'regressions'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/rules-wine-*/*.log
            ${{ runner.temp }}/rules-wine-*/*.json
            ${{ runner.temp }}/rules-wine-*/*.txt
      - name: Preserve regression failure logs
        if: failure() && matrix.platform == 'regressions'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-regressions-${{ matrix.bazel }}
          path: |
            /tmp/rules-wine-*/*.log
            /tmp/rules-wine-*/*.json
            bazel-testlogs/**/test.log
