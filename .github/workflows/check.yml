name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.30.0'
      - run: bazel run //.github/workflows:buildifier.check --lockfile_mode=off
  archive:
    name: Archive consumer / Bazel ${{ matrix.bazel }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel: ['8.5.0', '9.3.1']
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.30.0'
      - name: Package committed source and test the extracted consumer
        run: .github/workflows/check_archive.sh
