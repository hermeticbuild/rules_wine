name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/test.yml
  checks:
    uses: ./.github/workflows/check.yml
  release:
    needs: [tests, checks]
    permissions:
      contents: write
      id-token: write
      attestations: write
    # BCR's SLSA verifier requires a named ref for reusable workflow identities.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ github.ref_name }}
      bazel_test_command: cd e2e/smoke && bazel test //:x86_64_test --lockfile_mode=off
      release_files: rules_wine-*.tar.gz
      prerelease: false
      draft: true
  bcr:
    needs: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.6.0
    with:
      tag_name: ${{ github.ref_name }}
      registry_fork: hermeticbuild/bazel-central-registry
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
  publish:
    needs: bcr
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release edit "$RELEASE_TAG" --draft=false
